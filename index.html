<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>福瑞纳棂 · 极速中转</title>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            background: #fcfcfd;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== 动态背景层 ===== */
        .bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at 20% 30%, rgba(255, 180, 100, 0.10) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(255, 120, 50, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 220, 180, 0.06) 0%, transparent 70%),
                #fcfcfd;
        }

        /* ===== 粒子容器 ===== */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ===== 主容器 ===== */
        .container {
            position: relative;
            z-index: 1;
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
            padding: 10px 0 30px;
        }

        /* ===== 顶部标题 ===== */
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 0 10px;
        }

        .header-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 200, 150, 0.30);
            border-radius: 100px;
            padding: 6px 22px;
            font-size: 13px;
            font-weight: 500;
            color: #c0723a;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 12px rgba(255, 160, 80, 0.08);
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 34px;
            font-weight: 700;
            color: #1e1e1e;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header h1 span {
            background: linear-gradient(135deg, #f57c3a, #e8622a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #8a8a8a;
            font-size: 15px;
            font-weight: 400;
            margin-top: 8px;
            letter-spacing: 0.3px;
        }

        .header .status-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 14px;
            font-size: 13px;
            color: #999;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f5a623;
            animation: pulse-dot 1.6s ease-in-out infinite;
        }

        .status-dot.active {
            background: #34c759;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.85);
            }
        }

        /* ===== 卡片网格 ===== */
        .card-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-top: 8px;
        }

        @media (max-width: 640px) {
            .card-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .header h1 {
                font-size: 26px;
            }
        }

        /* ===== 卡片 ===== */
        .card-link {
            text-decoration: none;
            display: block;
            border-radius: 28px;
            overflow: hidden;
            position: relative;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.45s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03), 0 1px 4px rgba(0, 0, 0, 0.02);
            background: #ffffff;
            border: 1px solid rgba(255, 220, 190, 0.20);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .card-link:active {
            transform: scale(0.97);
        }

        .card-link:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 50px rgba(255, 130, 50, 0.10), 0 6px 20px rgba(0, 0, 0, 0.02);
            border-color: rgba(255, 180, 120, 0.30);
        }

        .card {
            position: relative;
            height: 260px;
            border-radius: 28px;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            background-color: #f5f0eb;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 24px 26px 28px;
            transition: all 0.3s ease;
        }

        /* 卡片背景图片（清晰无模糊） */
        .card-bg-1 {
            background-image: url('1.jpg');
        }
        .card-bg-2 {
            background-image: url('2.jpg');
        }

        /* ===== 遮罩层（仅用于提升文字可读性，完全保留图片清晰度） ===== */
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, 0.0) 0%,
                    rgba(255, 255, 255, 0.15) 30%,
                    rgba(255, 248, 242, 0.55) 70%,
                    rgba(255, 245, 240, 0.85) 100%);
            z-index: 1;
            /* 移除 backdrop-filter 以保持背景图片绝对清晰 */
        }

        /* 悬停时不再添加模糊，保持清晰 */
        .card-link:hover .card::before {
            /* 保持清晰，仅微调遮罩透明度 */
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, 0.0) 0%,
                    rgba(255, 255, 255, 0.1) 30%,
                    rgba(255, 248, 242, 0.5) 70%,
                    rgba(255, 245, 240, 0.8) 100%);
        }

        /* 卡片内容 */
        .card-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .card-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: #c0723a;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 4px 16px 4px 14px;
            border-radius: 100px;
            border: 1px solid rgba(255, 200, 150, 0.25);
            align-self: flex-start;
            letter-spacing: 0.3px;
            box-shadow: 0 2px 8px rgba(255, 160, 80, 0.06);
            margin-bottom: 4px;
        }

        .card-tag .icon {
            font-size: 14px;
        }

        .card-title {
            font-size: 24px;
            font-weight: 700;
            color: #1c1c1e;
            letter-spacing: -0.3px;
            line-height: 1.2;
            text-shadow: 0 1px 6px rgba(255, 255, 255, 0.40);
        }

        .card-address {
            font-size: 14px;
            font-weight: 400;
            color: #3a3a3a;
            letter-spacing: 0.2px;
            opacity: 0.9;
            text-shadow: 0 1px 6px rgba(255, 255, 255, 0.30);
        }

        /* ===== 延迟信息 ===== */
        .latency-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 200, 170, 0.20);
        }

        .latency-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #4a4a4a;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 4px 14px 4px 10px;
            border-radius: 100px;
            border: 1px solid rgba(255, 200, 170, 0.15);
        }

        .latency-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
            transition: background 0.5s ease, box-shadow 0.5s ease;
            background: #d1d1d6;
            box-shadow: 0 0 0 0 rgba(0, 0, 0, 0);
        }

        .latency-dot.loading {
            background: #f5a623;
            animation: pulse-dot-fast 0.8s ease-in-out infinite;
        }

        @keyframes pulse-dot-fast {
            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(0.6);
                opacity: 0.4;
            }
        }

        .latency-dot.green {
            background: #34c759;
            box-shadow: 0 0 12px rgba(52, 199, 89, 0.30);
        }

        .latency-dot.orange {
            background: #f5a623;
            box-shadow: 0 0 12px rgba(245, 166, 35, 0.30);
        }

        .latency-dot.red {
            background: #ff3b30;
            box-shadow: 0 0 12px rgba(255, 59, 48, 0.30);
        }

        .latency-dot.gray {
            background: #c7c7cc;
            box-shadow: none;
        }

        .latency-value {
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            color: #1c1c1e;
            min-width: 52px;
            transition: color 0.3s ease;
        }

        .latency-value.loading {
            color: #f5a623;
        }

        .latency-unit {
            font-weight: 400;
            color: #8a8a8a;
            font-size: 12px;
            margin-left: -2px;
        }

        .latency-status-text {
            font-size: 12px;
            font-weight: 400;
            color: #8a8a8a;
            margin-left: auto;
            background: rgba(255, 255, 255, 0.30);
            padding: 2px 12px;
            border-radius: 100px;
            border: 1px solid rgba(200, 200, 200, 0.15);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            white-space: nowrap;
        }

        /* ===== 底部刷新 ===== */
        .footer-actions {
            display: flex;
            justify-content: center;
            margin-top: 40px;
            gap: 16px;
            align-items: center;
        }

        .btn-refresh {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 200, 160, 0.25);
            border-radius: 100px;
            padding: 10px 28px 10px 24px;
            font-size: 14px;
            font-weight: 500;
            color: #4a4a4a;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02);
            -webkit-tap-highlight-color: transparent;
        }

        .btn-refresh:hover {
            background: rgba(255, 255, 255, 0.92);
            border-color: rgba(255, 160, 100, 0.35);
            box-shadow: 0 8px 28px rgba(255, 130, 50, 0.08);
            transform: translateY(-2px);
        }

        .btn-refresh:active {
            transform: scale(0.96);
        }

        .btn-refresh .icon-refresh {
            font-size: 16px;
            transition: transform 0.8s ease;
        }

        .btn-refresh:active .icon-refresh {
            transform: rotate(180deg);
        }

        .btn-refresh.spinning .icon-refresh {
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .footer-note {
            font-size: 12px;
            color: #b0b0b0;
            text-align: center;
            margin-top: 18px;
            letter-spacing: 0.3px;
            font-weight: 400;
        }

        /* ===== Toast 提示 ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 200, 170, 0.20);
            border-radius: 16px;
            padding: 12px 28px;
            font-size: 14px;
            color: #1c1c1e;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.06), 0 2px 8px rgba(0, 0, 0, 0.02);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 999;
            pointer-events: none;
            white-space: nowrap;
            font-weight: 500;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast .emoji {
            margin-right: 8px;
        }

        /* ===== 入场动画 ===== */
        .card-link {
            opacity: 0;
            transform: translateY(30px);
            animation: card-enter 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .card-link:nth-child(1) {
            animation-delay: 0.12s;
        }
        .card-link:nth-child(2) {
            animation-delay: 0.24s;
        }

        @keyframes card-enter {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 响应式微调 ===== */
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .card {
                height: 220px;
                padding: 18px 20px 22px;
            }
            .card-title {
                font-size: 20px;
            }
            .card-address {
                font-size: 13px;
            }
            .latency-row {
                flex-wrap: wrap;
                gap: 8px;
            }
            .latency-status-text {
                font-size: 11px;
                padding: 2px 10px;
            }
            .header h1 {
                font-size: 22px;
            }
            .header-badge {
                font-size: 11px;
                padding: 5px 16px;
            }
            .btn-refresh {
                padding: 8px 20px 8px 16px;
                font-size: 13px;
            }
            .toast {
                font-size: 13px;
                padding: 10px 20px;
                bottom: 20px;
                white-space: normal;
                max-width: 90%;
            }
        }

        /* ===== 滚动条美化 ===== */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e0d6ce;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #d0c4ba;
        }

        /* ===== 选中高亮 ===== */
        .card-link:focus-visible {
            outline: 3px solid #f57c3a;
            outline-offset: 2px;
        }
    </style>
</head>
<body>

    <!-- ===== 背景层 ===== -->
    <div class="bg-canvas"></div>
    <canvas id="particles"></canvas>

    <!-- ===== Toast ===== -->
    <div class="toast" id="toast">
        <span class="emoji">✅</span>
        <span id="toastMsg">已刷新延迟</span>
    </div>

    <!-- ===== 主容器 ===== -->
    <div class="container">

        <!-- 头部 -->
        <header class="header">
            <div class="header-badge">
                ⚡ 中转通道 · 福瑞纳棂
            </div>
            <h1>
                <span>福瑞纳棂</span>
                <span style="font-weight:300; color:#c0c0c0; font-size:0.5em; background:none; -webkit-text-fill-color:#c0c0c0;">·</span>
                <span style="font-weight:400; font-size:0.6em; color:#6a6a6a; background:none; -webkit-text-fill-color:#6a6a6a;">
                furrynaling</span>
            </h1>
            <div class="status-row">
                <span class="status-dot" id="globalStatusDot"></span>
                <span id="globalStatusText">正在测试延迟...</span>
            </div>
        </header>

        <!-- 卡片网格 -->
        <div class="card-grid">

            <!-- 卡片 1: 亚洲节点 -->
            <a class="card-link" href="https://naling.net" target="_blank" rel="noopener noreferrer" data-url="https://naling.net" data-name="亚洲节点">
                <div class="card card-bg-1">
                    <div class="card-content">
                        <div class="card-tag">
                            <span class="icon">🌏</span> 亚太优化
                        </div>
                        <div class="card-title">亚洲大陆</div>
                        <div class="card-address">naling.net</div>
                        <div class="latency-row">
                            <span class="latency-indicator">
                                <span class="latency-dot loading" id="dot-0"></span>
                                <span class="latency-value loading" id="latency-0">--</span>
                                <span class="latency-unit">ms</span>
                            </span>
                            <span class="latency-status-text" id="status-0">检测中…</span>
                        </div>
                    </div>
                </div>
            </a>

            <!-- 卡片 2: 福瑞纳棂 · 网站中转 -->
            <a class="card-link" href="https://furrynaling.com" target="_blank" rel="noopener noreferrer" data-url="https://furrynaling.com" data-name="福瑞纳棂中转">
                <div class="card card-bg-2">
                    <div class="card-content">
                        <div class="card-tag">
                            <span class="icon">🇺🇸</span> 北美专线
                        </div>
                        <div class="card-title">美国加洲</div>
                        <div class="card-address">furrynaling.com</div>
                        <div class="latency-row">
                            <span class="latency-indicator">
                                <span class="latency-dot loading" id="dot-1"></span>
                                <span class="latency-value loading" id="latency-1">--</span>
                                <span class="latency-unit">ms</span>
                            </span>
                            <span class="latency-status-text" id="status-1">检测中…</span>
                        </div>
                    </div>
                </div>
            </a>

        </div>

        <!-- 底部 -->
        <div class="footer-actions">
            <button class="btn-refresh" id="btnRefresh">
                <span class="icon-refresh">⟳</span>
                <span>刷新延迟</span>
            </button>
        </div>
        <div class="footer-note">
            ✦ FURRY.GOV.CN.NALING.ENT ✦
        </div>
    </div>

    <script>
        // ================================================================
        //  1. 粒子系统 (Canvas)
        // ================================================================
        (function initParticles() {
            const canvas = document.getElementById('particles');
            const ctx = canvas.getContext('2d');
            let w, h;
            const particles = [];
            const COUNT = 55;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Particle {
                constructor() {
                    this.reset();
                }
                reset() {
                    this.x = Math.random() * w;
                    this.y = Math.random() * h;
                    this.radius = Math.random() * 3.5 + 1.2;
                    this.speedX = (Math.random() - 0.5) * 0.25;
                    this.speedY = (Math.random() - 0.5) * 0.25;
                    this.opacity = Math.random() * 0.35 + 0.10;
                    this.hue = 28 + Math.random() * 14; // 橙色系
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.x < 0 || this.x > w) this.speedX *= -1;
                    if (this.y < 0 || this.y > h) this.speedY *= -1;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${this.hue}, 80%, 70%, ${this.opacity})`;
                    ctx.fill();
                    // 光晕
                    if (this.radius > 2.5) {
                        ctx.shadowColor = `hsla(${this.hue}, 90%, 75%, 0.15)`;
                        ctx.shadowBlur = 12;
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }
                }
            }

            for (let i = 0; i < COUNT; i++) {
                particles.push(new Particle());
            }

            function animate() {
                ctx.clearRect(0, 0, w, h);
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                // 连接线 (距离近的粒子)
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 150) {
                            const alpha = (1 - dist / 150) * 0.08;
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(255, 180, 120, ${alpha})`;
                            ctx.lineWidth = 0.8;
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(animate);
            }
            animate();

            // 窗口变化重置粒子位置
            window.addEventListener('resize', () => {
                particles.forEach(p => {
                    p.x = Math.min(p.x, w);
                    p.y = Math.min(p.y, h);
                });
            });
        })();

        // ================================================================
        //  2. 延迟测试逻辑
        // ================================================================
        const nodes = [
            { id: 0, url: 'https://naling.net', name: '亚洲节点', dotId: 'dot-0', latencyId: 'latency-0', statusId: 'status-0' },
            { id: 1, url: 'https://furrynaling.com', name: '福瑞纳棂', dotId: 'dot-1', latencyId: 'latency-1',
            statusId: 'status-1' }
        ];

        const dotEls = {};
        const latencyEls = {};
        const statusEls = {};
        let testing = false;

        // DOM 引用
        nodes.forEach(n => {
            dotEls[n.id] = document.getElementById(n.dotId);
            latencyEls[n.id] = document.getElementById(n.latencyId);
            statusEls[n.id] = document.getElementById(n.statusId);
        });

        const globalDot = document.getElementById('globalStatusDot');
        const globalText = document.getElementById('globalStatusText');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');
        const btnRefresh = document.getElementById('btnRefresh');

        let toastTimer = null;

        function showToast(msg, emoji = '✅') {
            toastMsg.textContent = msg;
            toast.querySelector('.emoji').textContent = emoji;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2200);
        }

        function setLatencyState(id, value, statusText, dotClass) {
            const dot = dotEls[id];
            const lat = latencyEls[id];
            const st = statusEls[id];

            if (dot) {
                dot.className = 'latency-dot ' + dotClass;
            }
            if (lat) {
                lat.textContent = value;
                lat.className = 'latency-value';
                if (dotClass === 'loading') lat.classList.add('loading');
            }
            if (st) {
                st.textContent = statusText;
            }
        }

        async function testSingleNode(id, url) {
            const dot = dotEls[id];
            const lat = latencyEls[id];
            const st = statusEls[id];

            // 设置为加载状态
            if (dot) { dot.className = 'latency-dot loading'; }
            if (lat) { lat.textContent = '--';
                lat.className = 'latency-value loading'; }
            if (st) { st.textContent = '检测中…'; }

            const startTime = performance.now();
            let success = false;
            let elapsed = 0;

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 6000);

                const resp = await fetch(url, {
                    method: 'HEAD',
                    mode: 'cors',
                    cache: 'no-store',
                    signal: controller.signal,
                    headers: { 'Cache-Control': 'no-cache' }
                });

                clearTimeout(timeoutId);
                elapsed = Math.round(performance.now() - startTime);
                success = resp.ok || resp.type === 'opaque' || resp.status < 400;
            } catch (err) {
                // 如果 HEAD 失败，尝试 GET (仅请求极小资源)
                try {
                    const controller2 = new AbortController();
                    const timeoutId2 = setTimeout(() => controller2.abort(), 6000);
                    const resp2 = await fetch(url, {
                        method: 'GET',
                        mode: 'cors',
                        cache: 'no-store',
                        signal: controller2.signal,
                        headers: { 'Range': 'bytes=0-0' } // 只请求第一个字节
                    });
                    clearTimeout(timeoutId2);
                    elapsed = Math.round(performance.now() - startTime);
                    success = true;
                } catch (err2) {
                    // 彻底失败
                    elapsed = -1;
                    success = false;
                }
            }

            // 更新 UI
            if (success && elapsed > 0 && elapsed < 6000) {
                let dotClass = 'green';
                let statusText = '优秀';
                if (elapsed > 300) { dotClass = 'orange';
                    statusText = '良好'; }
                if (elapsed > 800) { dotClass = 'red';
                    statusText = '较慢'; }
                if (elapsed > 2000) { dotClass = 'red';
                    statusText = '高延迟'; }
                setLatencyState(id, elapsed, statusText, dotClass);
                return { id, success: true, latency: elapsed };
            } else {
                setLatencyState(id, '--', '不可达', 'gray');
                return { id, success: false, latency: -1 };
            }
        }

        async function testAllNodes(showToastMsg = true) {
            if (testing) return;
            testing = true;

            // 全局状态
            globalDot.className = 'status-dot';
            globalText.textContent = '前测试所有节点…';
            btnRefresh.classList.add('spinning');

            const results = await Promise.all(nodes.map(n => testSingleNode(n.id, n.url)));

            const successCount = results.filter(r => r.success).length;
            const total = results.length;

            if (successCount === total) {
                globalDot.className = 'status-dot active';
                globalText.textContent = `✅ 全部 ${total} 个节点在线`;
                if (showToastMsg) showToast(`全部 ${total} 个节点延迟已更新`, '📡');
            } else if (successCount > 0) {
                globalDot.className = 'status-dot';
                globalText.textContent = `⚠️ ${successCount}/${total} 个节点在线`;
                if (showToastMsg) showToast(`${successCount}/${total} 个节点可访问`, '⚠️');
            } else {
                globalDot.className = 'status-dot';
                globalText.textContent = '❌ 所有节点不可达';
                if (showToastMsg) showToast('所有节点不可达，请检查网络', '❌');
            }

            btnRefresh.classList.remove('spinning');
            testing = false;
        }

        // ================================================================
        //  3. 自动测试 & 刷新按钮
        // ================================================================

        // 页面加载后自动测试
        window.addEventListener('load', () => {
            // 稍微延迟，让动画先播放
            setTimeout(() => {
                testAllNodes(true);
            }, 600);
        });

        // 刷新按钮
        btnRefresh.addEventListener('click', () => {
            if (testing) return;
            testAllNodes(true);
        });

        // ================================================================
        //  4. 卡片点击跳转 (已用 a 标签实现)
        //    额外：点击时记录并显示 toast
        // ================================================================
        document.querySelectorAll('.card-link').forEach(link => {
            link.addEventListener('click', function(e) {
                const name = this.dataset.name || '节点';
                const url = this.dataset.url || '#';
                // 显示跳转提示（不阻止默认行为）
                showToast(`正在前往 ${name}`, '🚀');
                // 延迟一点点让 toast 显示
                // 但不要阻塞跳转
            });
        });

        // ================================================================
        //  5. 键盘快捷键: R 刷新
        // ================================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                if (!e.ctrlKey && !e.metaKey) {
                    e.preventDefault();
                    if (!testing) testAllNodes(true);
                }
            }
        });

        // ================================================================
        //  6. 可见性变化时重新测试 (用户切回页面时)
        // ================================================================
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                // 如果超过30秒没有测试，自动重新测试
                const lastTestTime = window._lastTestTime || 0;
                if (Date.now() - lastTestTime > 30000 && !testing) {
                    testAllNodes(false);
                }
            }
        });

        // 记录测试时间
        const origTestAll = testAllNodes;
        testAllNodes = async function(showMsg) {
            const result = await origTestAll(showMsg);
            window._lastTestTime = Date.now();
            return result;
        };

        // 暴露给全局方便调试
        window.testNodes = testAllNodes;

        console.log('✨ 福瑞纳棂导航已启动 | 按 R 键刷新延迟');
    </script>
</body>
</html>
