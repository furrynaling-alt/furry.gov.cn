<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>福瑞纳棂 · 网站中转</title>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            background: #fcfcfd;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at 20% 30%, rgba(255, 180, 100, 0.10) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(255, 120, 50, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 220, 180, 0.06) 0%, transparent 70%),
                #fcfcfd;
        }

        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
            padding: 10px 0 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 0 10px;
        }

        .header-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 200, 150, 0.30);
            border-radius: 100px;
            padding: 6px 22px;
            font-size: 13px;
            font-weight: 500;
            color: #c0723a;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 12px rgba(255, 160, 80, 0.08);
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 34px;
            font-weight: 700;
            color: #1e1e1e;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header h1 span {
            background: linear-gradient(135deg, #f57c3a, #e8622a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .status-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 14px;
            font-size: 13px;
            color: #999;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f5a623;
            animation: pulse-dot 1.6s ease-in-out infinite;
        }

        .status-dot.active {
            background: #34c759;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.85);
            }
        }

        .card-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-top: 8px;
        }

        @media (max-width: 640px) {
            .card-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .header h1 {
                font-size: 26px;
            }
        }

        /* ===== 卡片容器（改用 div，不使用 a 标签） ===== */
        .card-link {
            display: block;
            border-radius: 28px;
            overflow: hidden;
            position: relative;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.45s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03), 0 1px 4px rgba(0, 0, 0, 0.02);
            background: #ffffff;
            border: 1px solid rgba(255, 220, 190, 0.20);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
            color: inherit;
        }

        .card-link:active {
            transform: scale(0.97);
        }

        .card-link:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 50px rgba(255, 130, 50, 0.10), 0 6px 20px rgba(0, 0, 0, 0.02);
            border-color: rgba(255, 180, 120, 0.30);
        }

        .card {
            position: relative;
            height: 260px;
            border-radius: 28px;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            background-color: #f5f0eb;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 24px 26px 28px;
            transition: all 0.3s ease;
        }

        .card-bg-1 {
            background-image: url('1.jpg');
        }
        .card-bg-2 {
            background-image: url('2.jpg');
        }
        .card-bg-3 {
            background-image: url('3.jpg');
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, 0.0) 0%,
                    rgba(255, 255, 255, 0.15) 30%,
                    rgba(255, 248, 242, 0.55) 70%,
                    rgba(255, 245, 240, 0.85) 100%);
            z-index: 1;
        }

        .card-link:hover .card::before {
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, 0.0) 0%,
                    rgba(255, 255, 255, 0.1) 30%,
                    rgba(255, 248, 242, 0.5) 70%,
                    rgba(255, 245, 240, 0.8) 100%);
        }

        /* ===== 复制按钮（仅Tor，文字） ===== */
        .copy-link-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 20;
            font-size: 13px;
            font-weight: 500;
            color: #7c3aed;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(160, 80, 255, 0.25);
            border-radius: 20px;
            padding: 4px 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            -webkit-tap-highlight-color: transparent;
            font-family: inherit;
            line-height: 1.4;
            user-select: none;
            pointer-events: auto;
        }

        .copy-link-btn:hover {
            background: rgba(255, 255, 255, 0.92);
            border-color: rgba(160, 80, 255, 0.50);
            box-shadow: 0 4px 16px rgba(160, 80, 255, 0.12);
            transform: scale(1.02);
        }

        .copy-link-btn:active {
            transform: scale(0.94);
        }

        .copy-link-btn.copied {
            color: #16a34a;
            border-color: rgba(22, 163, 74, 0.30);
            background: rgba(255, 255, 255, 0.85);
        }

        .card-link:not(.card-tor) .copy-link-btn {
            display: none;
        }

        .card-tor .card-tag {
            border-color: rgba(160, 80, 255, 0.30);
            color: #7c3aed;
            background: rgba(255, 255, 255, 0.60);
        }

        .card-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .card-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: #c0723a;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 4px 16px 4px 14px;
            border-radius: 100px;
            border: 1px solid rgba(255, 200, 150, 0.25);
            align-self: flex-start;
            letter-spacing: 0.3px;
            box-shadow: 0 2px 8px rgba(255, 160, 80, 0.06);
            margin-bottom: 4px;
        }

        .card-tag .icon {
            font-size: 14px;
        }

        .card-title {
            font-size: 24px;
            font-weight: 700;
            color: #1c1c1e;
            letter-spacing: -0.3px;
            line-height: 1.2;
            text-shadow: 0 1px 6px rgba(255, 255, 255, 0.40);
        }

        .card-address {
            font-size: 13px;
            font-weight: 400;
            color: #3a3a3a;
            letter-spacing: 0.2px;
            opacity: 0.9;
            text-shadow: 0 1px 6px rgba(255, 255, 255, 0.30);
            word-break: break-all;
            line-height: 1.4;
        }

        .latency-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 200, 170, 0.20);
        }

        .latency-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #4a4a4a;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 4px 14px 4px 10px;
            border-radius: 100px;
            border: 1px solid rgba(255, 200, 170, 0.15);
        }

        .latency-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
            transition: background 0.5s ease, box-shadow 0.5s ease;
            background: #d1d1d6;
            box-shadow: 0 0 0 0 rgba(0, 0, 0, 0);
        }

        .latency-dot.loading {
            background: #f5a623;
            animation: pulse-dot-fast 0.8s ease-in-out infinite;
        }

        @keyframes pulse-dot-fast {
            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(0.6);
                opacity: 0.4;
            }
        }

        .latency-dot.green {
            background: #34c759;
            box-shadow: 0 0 12px rgba(52, 199, 89, 0.30);
        }

        .latency-dot.orange {
            background: #f5a623;
            box-shadow: 0 0 12px rgba(245, 166, 35, 0.30);
        }

        .latency-dot.red {
            background: #ff3b30;
            box-shadow: 0 0 12px rgba(255, 59, 48, 0.30);
        }

        .latency-dot.gray {
            background: #c7c7cc;
            box-shadow: none;
        }

        .latency-value {
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            color: #1c1c1e;
            min-width: 52px;
            transition: color 0.3s ease;
        }

        .latency-value.loading {
            color: #f5a623;
        }

        .latency-unit {
            font-weight: 400;
            color: #8a8a8a;
            font-size: 12px;
            margin-left: -2px;
        }

        .latency-status-text {
            font-size: 12px;
            font-weight: 400;
            color: #8a8a8a;
            margin-left: auto;
            background: rgba(255, 255, 255, 0.30);
            padding: 2px 12px;
            border-radius: 100px;
            border: 1px solid rgba(200, 200, 200, 0.15);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            white-space: nowrap;
        }

        .footer-actions {
            display: flex;
            justify-content: center;
            margin-top: 40px;
            gap: 16px;
            align-items: center;
        }

        .btn-refresh {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 200, 160, 0.25);
            border-radius: 100px;
            padding: 10px 28px 10px 24px;
            font-size: 14px;
            font-weight: 500;
            color: #4a4a4a;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02);
            -webkit-tap-highlight-color: transparent;
        }

        .btn-refresh:hover {
            background: rgba(255, 255, 255, 0.92);
            border-color: rgba(255, 160, 100, 0.35);
            box-shadow: 0 8px 28px rgba(255, 130, 50, 0.08);
            transform: translateY(-2px);
        }

        .btn-refresh:active {
            transform: scale(0.96);
        }

        .btn-refresh .icon-refresh {
            font-size: 16px;
            transition: transform 0.8s ease;
        }

        .btn-refresh:active .icon-refresh {
            transform: rotate(180deg);
        }

        .btn-refresh.spinning .icon-refresh {
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .footer-note {
            font-size: 12px;
            color: #b0b0b0;
            text-align: center;
            margin-top: 18px;
            letter-spacing: 0.3px;
            font-weight: 400;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 200, 170, 0.20);
            border-radius: 16px;
            padding: 12px 28px;
            font-size: 14px;
            color: #1c1c1e;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.06), 0 2px 8px rgba(0, 0, 0, 0.02);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 999;
            pointer-events: none;
            white-space: nowrap;
            font-weight: 500;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast .emoji {
            margin-right: 8px;
        }

        .card-link {
            opacity: 0;
            transform: translateY(30px);
            animation: card-enter 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .card-link:nth-child(1) {
            animation-delay: 0.08s;
        }
        .card-link:nth-child(2) {
            animation-delay: 0.16s;
        }
        .card-link:nth-child(3) {
            animation-delay: 0.24s;
        }

        @keyframes card-enter {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .card {
                height: 220px;
                padding: 18px 20px 22px;
            }
            .card-title {
                font-size: 20px;
            }
            .card-address {
                font-size: 12px;
            }
            .latency-row {
                flex-wrap: wrap;
                gap: 8px;
            }
            .latency-status-text {
                font-size: 11px;
                padding: 2px 10px;
            }
            .header h1 {
                font-size: 22px;
            }
            .header-badge {
                font-size: 11px;
                padding: 5px 16px;
            }
            .btn-refresh {
                padding: 8px 20px 8px 16px;
                font-size: 13px;
            }
            .toast {
                font-size: 13px;
                padding: 10px 20px;
                bottom: 20px;
                white-space: normal;
                max-width: 90%;
            }
            .copy-link-btn {
                font-size: 11px;
                padding: 3px 12px;
                top: 12px;
                right: 12px;
            }
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e0d6ce;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #d0c4ba;
        }

        .card-link:focus-visible {
            outline: 3px solid #f57c3a;
            outline-offset: 2px;
        }
    </style>
</head>
<body>

    <script>
        // ================================================================
        //  1. 粒子系统 (Canvas)
        // ================================================================
        (function initParticles() {
            const canvas = document.getElementById('particles');
            const ctx = canvas.getContext('2d');
            let w, h;
            const particles = [];
            const COUNT = 55;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Particle {
                constructor() {
                    this.reset();
                }
                reset() {
                    this.x = Math.random() * w;
                    this.y = Math.random() * h;
                    this.radius = Math.random() * 3.5 + 1.2;
                    this.speedX = (Math.random() - 0.5) * 0.25;
                    this.speedY = (Math.random() - 0.5) * 0.25;
                    this.opacity = Math.random() * 0.35 + 0.10;
                    this.hue = 28 + Math.random() * 14;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.x < 0 || this.x > w) this.speedX *= -1;
                    if (this.y < 0 || this.y > h) this.speedY *= -1;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${this.hue}, 80%, 70%, ${this.opacity})`;
                    ctx.fill();
                    if (this.radius > 2.5) {
                        ctx.shadowColor = `hsla(${this.hue}, 90%, 75%, 0.15)`;
                        ctx.shadowBlur = 12;
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }
                }
            }

            for (let i = 0; i < COUNT; i++) {
                particles.push(new Particle());
            }

            function animate() {
                ctx.clearRect(0, 0, w, h);
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 150) {
                            const alpha = (1 - dist / 150) * 0.08;
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(255, 180, 120, ${alpha})`;
                            ctx.lineWidth = 0.8;
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(animate);
            }
            animate();

            window.addEventListener('resize', () => {
                particles.forEach(p => {
                    p.x = Math.min(p.x, w);
                    p.y = Math.min(p.y, h);
                });
            });
        })();

        // ================================================================
        //  2. 卡片跳转（使用 div 替代 a 标签）
        // ================================================================
        document.querySelectorAll('.card-link').forEach(card => {
            card.addEventListener('click', function(e) {
                // 如果点击的是复制按钮，不跳转
                if (e.target.closest('.copy-link-btn')) return;
                const url = this.dataset.url;
                const name = this.dataset.name || '节点';
                if (url) {
                    showToast(`正在前往 ${name}`, '🚀');
                    // 延迟一点点让 toast 显示，然后跳转
                    setTimeout(() => {
                        window.open(url, '_blank');
                    }, 300);
                }
            });
        });

        // ================================================================
        //  3. 复制功能（终极稳定版）
        // ================================================================
        // 直接使用 onclick 属性绑定，避免事件干扰
        document.querySelectorAll('.copy-link-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                e.preventDefault();
                const text = this.getAttribute('data-copy');
                if (!text) {
                    showToast('没有可复制的内容', '❌');
                    return;
                }

                // 方法1：使用 Clipboard API（现代浏览器）
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text)
                        .then(() => {
                            showToast('已复制链接到剪贴板', '📋');
                            setCopiedState(this);
                        })
                        .catch(() => {
                            // 如果失败，使用终极备用方案
                            ultimateFallbackCopy(text, this);
                        });
                } else {
                    ultimateFallbackCopy(text, this);
                }
                return false;
            });
        });

        // 终极备用方案：使用 input 元素复制，并确保在移动端生效
        function ultimateFallbackCopy(text, btn) {
            // 创建一个可见但透明的 input
            const input = document.createElement('input');
            input.value = text;
            input.style.position = 'fixed';
            input.style.left = '0';
            input.style.top = '0';
            input.style.width = '1px';
            input.style.height = '1px';
            input.style.opacity = '0.01';
            input.style.zIndex = '9999';
            input.setAttribute('readonly', 'readonly');
            document.body.appendChild(input);
            input.focus();
            input.select();

            try {
                const success = document.execCommand('copy');
                if (success) {
                    showToast('已复制链接到剪贴板', '📋');
                    setCopiedState(btn);
                } else {
                    // 如果 execCommand 也失败，则显示一个可手动复制的弹窗
                    showManualCopyDialog(text);
                }
            } catch (err) {
                showManualCopyDialog(text);
            }
            document.body.removeChild(input);
        }

        // 最后的兜底方案：弹出一个对话框，显示链接并让用户手动复制
        function showManualCopyDialog(text) {
            // 使用 alert 显示链接，用户可长按复制（在移动端有效）
            // 但 alert 不能选择文本，我们用 prompt 替代
            const userInput = prompt('复制失败，请手动复制以下链接：', text);
            // 用户点击确定或取消无所谓，我们不再操作
            if (userInput !== null) {
                // 用户可能点击了确定，但未复制，我们不再提示
            }
            // 同时显示 toast
            showToast('请手动复制链接', '📋');
        }

        function setCopiedState(btn) {
            const original = btn.textContent;
            btn.textContent = '已复制 ✓';
            btn.classList.add('copied');
            clearTimeout(btn._copyTimer);
            btn._copyTimer = setTimeout(() => {
                btn.textContent = original;
                btn.classList.remove('copied');
            }, 2000);
        }

        // ================================================================
        //  4. 延迟测试逻辑（不可达显示）
        // ================================================================
        const nodes = [
            { id: 0, url: 'https://naling.net', name: '亚洲节点', dotId: 'dot-0', latencyId: 'latency-0', statusId: 'status-0' },
            { id: 1, url: 'https://furrynaling.com', name: '福瑞纳棂', dotId: 'dot-1', latencyId: 'latency-1', statusId: 'status-1' },
            { id: 2, url: 'http://furrydreaaqem74wi4qkc2q3dx5oc6prvzuvevjke62kyphvkzihxsad.onion', name: 'Tor私享', dotId: 'dot-2', latencyId: 'latency-2', statusId: 'status-2' }
        ];

        const dotEls = {};
        const latencyEls = {};
        const statusEls = {};
        let testing = false;

        nodes.forEach(n => {
            dotEls[n.id] = document.getElementById(n.dotId);
            latencyEls[n.id] = document.getElementById(n.latencyId);
            statusEls[n.id] = document.getElementById(n.statusId);
        });

        const globalDot = document.getElementById('globalStatusDot');
        const globalText = document.getElementById('globalStatusText');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');
        const btnRefresh = document.getElementById('btnRefresh');

        let toastTimer = null;

        function showToast(msg, emoji = '✅') {
            toastMsg.textContent = msg;
            toast.querySelector('.emoji').textContent = emoji;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2200);
        }

        function setLatencyState(id, value, statusText, dotClass) {
            const dot = dotEls[id];
            const lat = latencyEls[id];
            const st = statusEls[id];

            if (dot) {
                dot.className = 'latency-dot ' + dotClass;
            }
            if (lat) {
                lat.textContent = value;
                lat.className = 'latency-value';
                if (dotClass === 'loading') lat.classList.add('loading');
            }
            if (st) {
                st.textContent = statusText;
            }
        }

        async function testSingleNode(id, url) {
            const dot = dotEls[id];
            const lat = latencyEls[id];
            const st = statusEls[id];

            if (dot) { dot.className = 'latency-dot loading'; }
            if (lat) { lat.textContent = '--';
                lat.className = 'latency-value loading'; }
            if (st) { st.textContent = '检测中…'; }

            const startTime = performance.now();
            let success = false;
            let elapsed = 0;

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 6000);

                const resp = await fetch(url, {
                    method: 'HEAD',
                    mode: 'cors',
                    cache: 'no-store',
                    signal: controller.signal,
                    headers: { 'Cache-Control': 'no-cache' }
                });

                clearTimeout(timeoutId);
                elapsed = Math.round(performance.now() - startTime);
                success = resp.ok || resp.type === 'opaque' || resp.status < 400;
            } catch (err) {
                elapsed = Math.round(performance.now() - startTime);
                success = false;
            }

            if (success && elapsed > 0 && elapsed < 6000) {
                let dotClass, statusText;
                if (elapsed <= 300) {
                    dotClass = 'green';
                    statusText = '优秀';
                } else if (elapsed <= 800) {
                    dotClass = 'orange';
                    statusText = '良好';
                } else if (elapsed <= 2000) {
                    dotClass = 'red';
                    statusText = '较慢';
                } else {
                    dotClass = 'red';
                    statusText = '高延迟';
                }
                setLatencyState(id, elapsed, statusText, dotClass);
                return { id, success: true, latency: elapsed };
            } else {
                setLatencyState(id, '--', '不可达', 'gray');
                return { id, success: false, latency: -1 };
            }
        }

        async function testAllNodes(showToastMsg = true) {
            if (testing) return;
            testing = true;

            globalDot.className = 'status-dot';
            globalText.textContent = '正在测试所有节点…';
            btnRefresh.classList.add('spinning');

            const results = await Promise.all(nodes.map(n => testSingleNode(n.id, n.url)));

            const successCount = results.filter(r => r.success).length;
            const total = results.length;

            if (successCount === total) {
                globalDot.className = 'status-dot active';
                globalText.textContent = `✅ 全部 ${total} 个节点在线`;
                if (showToastMsg) showToast(`全部 ${total} 个节点延迟已更新`, '📡');
            } else if (successCount > 0) {
                globalDot.className = 'status-dot';
                globalText.textContent = `⚠️ ${successCount}/${total} 个节点在线，${total - successCount} 个不可达`;
                if (showToastMsg) showToast(`${successCount}/${total} 个节点可访问`, '⚠️');
            } else {
                globalDot.className = 'status-dot';
                globalText.textContent = '❌ 所有节点不可达';
                if (showToastMsg) showToast('所有节点不可达，请检查网络', '❌');
            }

            btnRefresh.classList.remove('spinning');
            testing = false;
        }

        // ================================================================
        //  5. 自动测试 & 刷新
        // ================================================================
        window.addEventListener('load', () => {
            setTimeout(() => {
                testAllNodes(true);
            }, 600);
        });

        btnRefresh.addEventListener('click', () => {
            if (testing) return;
            testAllNodes(true);
        });

        // ================================================================
        //  6. 键盘快捷键 R
        // ================================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                if (!e.ctrlKey && !e.metaKey) {
                    e.preventDefault();
                    if (!testing) testAllNodes(true);
                }
            }
        });

        // ================================================================
        //  7. 可见性变化重新测试
        // ================================================================
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                const lastTestTime = window._lastTestTime || 0;
                if (Date.now() - lastTestTime > 30000 && !testing) {
                    testAllNodes(false);
                }
            }
        });

        const origTestAll = testAllNodes;
        testAllNodes = async function(showMsg) {
            const result = await origTestAll(showMsg);
            window._lastTestTime = Date.now();
            return result;
        };

        window.testNodes = testAllNodes;
        console.log('✨ 福瑞纳棂导航已启动 | 按 R 键刷新延迟');
    </script>
</body>
</html>
